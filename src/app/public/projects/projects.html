<div class="portfolioPage">

  <div class="phead d-flex align-items-start justify-content-between">

    <h2
      class="route-animate animate-fade-up"
      style="--route-delay: 360ms; --route-duration: 800ms;"
    >
      Discover our <br>
      <strong>work</strong>
    </h2>

    @if (years.length > 0) {
      <h4
        class="route-animate animate-fade-up"
        style="--route-delay: 400ms; --route-duration: 800ms;"
      >
        {{ years[0] }}
      </h4>
    }

  </div>


  <div
    class="cardList"
    [routeStagger]="100"
    [routeStaggerStart]="600"
    style="--route-duration: 700ms;"
  >

    @for (
      project of projects;
      track project.id;
      let index = $index
    ) {

      <div class="card_items route-animate animate-fade-up">

        <div class="ci_content">

          <div class="cic_top">

            <span>
              {{ project.year }}
            </span>

            <h2>
              {{ project.title }}
            </h2>

            <p>
              {{ project.description }}
            </p>

          </div>


          <div class="cic_bottom d-flex justify-content-end">

            <a
              class="arrow_card"
              [attr.href]="'/projects/' + project.slug"
              [attr.aria-label]="'View ' + project.title"
            >

              <img
                src="assets/images/arrow_line.svg"
                alt="Arrow"
              />

            </a>

          </div>

        </div>


        @if (project.coverImage) {

          <div class="ci_img">

            <img
              [src]="project.coverImage"
              [alt]="project.title"
              loading="lazy"
            />

          </div>

        }

      </div>

    }

  </div>

</div>
