<button
      #completionButton
      type="button"
      class="canvas-complete-button"
      aria-hidden="true"
      tabindex="-1"
      (click)="goTo('/portfolio', $event)">
      {{ buttonText }}
    </button>
<section class="canvas-video-section" #canvasVideoSection>
  <div class="canvas-video-sticky">
    <canvas
      #videoCanvas
      class="video-canvas"
      aria-hidden="true">
    </canvas>

    <div
      #canvasLoader
      class="canvas-loader"
      role="status"
      aria-live="polite">
      Loading: 0%
    </div>

    <div class="canvas-progress d-none" aria-hidden="true">
      <div
        #canvasProgressBar
        class="canvas-progress-bar">
      </div>
    </div>
    
  </div>
</section>
