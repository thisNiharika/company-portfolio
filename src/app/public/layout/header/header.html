<header class="header">
    <div class="logo route-animate animate-fade-up" style="--route-delay: 200ms; --route-duration: 800ms;">
        <a href="javascript:void(0)" class="d-block w-100">
            <img class="img-fluid" src="assets/images/itm_logo.svg" alt="ITech Mission" />
        </a>
    </div>
    <div class="headerFilter">
        <div class="h_filter route-animate animate-fade-up" style="--route-delay: 240ms; --route-duration: 800ms;">
            <img src="assets/images/filter.svg" alt="Filter Icon" /> Filter
        </div>
        <div class="h_search route-animate animate-fade-up" style="--route-delay: 280ms; --route-duration: 800ms;">
            <input type="search" placeholder="Search" />
            <img class="search_icon" src="assets/images/search.svg" alt="Search Icon" />
        </div>
    </div>
    <div class="humburger route-animate animate-fade-up" style="--route-delay: 320ms; --route-duration: 800ms;">
        <img class="hb_menu pointer" src="assets/images/menu.svg" alt="Menu Icon" />
    </div>
</header>
